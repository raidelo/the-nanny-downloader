[project]
name = "the-nanny-downloader"
version = "0.1.0"
description = "The Nanny series downloader"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["beautifulsoup4>=4.13.5", "requests>=2.32.5", "rich>=14.1.0"]

[project.scripts]
tndl = "the_nanny_downloader.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
